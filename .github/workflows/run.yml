name: dbt_hop_pipeline

on:
  push:
    branches:
      - main

jobs:
  execution:
    runs-on: ubuntu-latest

    env:
      # Variáveis de ambiente (Secrets do GitHub)
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Ajustado para Java 17 (Mais estável para o motor do Hop)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 1. Instalar o Apache Hop Client (Ajustado para 2.10.0)
      - name: Download and Install Apache Hop
        run: |
          wget https://archive.apache.org/dist/hop/2.10.0/apache-hop-client-2.10.0.zip
          unzip -q apache-hop-client-2.10.0.zip -d hop_engine
          chmod +x hop_engine/hop/hop-run.sh
          chmod +x hop_engine/hop/hop-conf.sh

      # 2. Baixar o Driver JDBC do Postgres
      - name: Install Postgres JDBC Driver
        run: |
          wget https://jdbc.postgresql.org/download/postgresql-42.7.1.jar
          cp postgresql-42.7.1.jar hop_engine/hop/lib/jdbc/

      # 3. Registrar e Executar Ingestão com Apache Hop
      - name: Register and Run Ingestion (Apache Hop)
        run: |
          # A. Registrar o projeto (usando --project-create corretamente)
          ./hop_engine/hop/hop-conf.sh \
            --project=sonar_eng \
            --project-create \
            --project-home=${{ github.workspace }}

          # B. Executar o workflow
          ./hop_engine/hop/hop-run.sh \
            --project=sonar_eng \
            --file=${{ github.workspace }}/hop/workflows/workflow_master.hwf \
            --runconfig=local \
            --parameters=DB_HOST=${{ env.DB_HOST }},DB_USER=${{ env.DB_USER }},DB_PASSWORD=${{ env.DB_PASSWORD }},DB_PORT=${{ env.DB_PORT }},DB_NAME=${{ env.DB_NAME }}

      # 4. Instalar dbt
      - name: Install dbt
        run: pip install dbt-postgres

      # 5. Executar Transformação (dbt)
      - name: dbt Build
        run: |
          cd Dbt_project
          dbt deps
          dbt build --profiles-dir .