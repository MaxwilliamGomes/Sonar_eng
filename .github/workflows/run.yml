name: dbt_hop_pipeline

on:
  push:
    branches:
      - main

jobs:
  execution:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      PROJECT_HOME: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Download and Install Apache Hop
        run: |
          wget https://archive.apache.org/dist/hop/2.10.0/apache-hop-client-2.10.0.zip
          unzip -q apache-hop-client-2.10.0.zip -d hop_engine
          chmod +x hop_engine/hop/hop-run.sh
          chmod +x hop_engine/hop/hop-conf.sh

      - name: Install Postgres JDBC Driver
        run: |
          wget https://jdbc.postgresql.org/download/postgresql-42.7.1.jar
          cp postgresql-42.7.1.jar hop_engine/hop/lib/jdbc/

      - name: Configure Hop Project
        run: |
          # Criar diretório de configuração do Hop
          mkdir -p $HOME/.hop
          
          # Copiar metadados do projeto
          cp -r metadata $HOME/.hop/
          
          # Atualizar sonar_eng.json com credenciais reais
          sed -i "s|db.vjekjvwztahphnwtbkgp.supabase.co|${{ env.DB_HOST }}|g" $HOME/.hop/metadata/rdbms/sonar_eng.json
          sed -i "s|Encrypted 2be98d4ca704c680bbbb16bd64d7|Encrypted ${{ env.DB_PASSWORD }}|g" $HOME/.hop/metadata/rdbms/sonar_eng.json
          sed -i "s|5432|${{ env.DB_PORT }}|g" $HOME/.hop/metadata/rdbms/sonar_eng.json
          sed -i "s|postgres|${{ env.DB_USER }}|g" $HOME/.hop/metadata/rdbms/sonar_eng.json

      - name: Run Apache Hop Workflow
        run: |
          ./hop_engine/hop/hop-run.sh \
            -f ${PROJECT_HOME}/hop/workflows/workflow_master.hwf \
            -r local \
            -p PROJECT_HOME=${PROJECT_HOME} \
            -p DB_HOST=${{ env.DB_HOST }} \
            -p DB_USER=${{ env.DB_USER }} \
            -p DB_PASSWORD=${{ env.DB_PASSWORD }} \
            -p DB_PORT=${{ env.DB_PORT }} \
            -p DB_NAME=${{ env.DB_NAME }} \
            -l Detailed

      - name: Install dbt
        run: pip install dbt-postgres

      - name: dbt Build
        run: |
          cd Dbt_project
          dbt deps
          dbt build --profiles-dir .