version: 2

sources:
  - name: public
    schema: public
    description: "Dados brutos carregados dos CSVs (Camada Bronze)"
    tables:
      - name: customers
      - name: work_orders
      - name: parts_sales
        
models:
  - name: silver_customers
    description: "Tabela de clientes com histórico (SCD2). A customer_sk garante a unicidade da versão."
    columns:
      - name: customer_sk
        description: "Chave única por versão (MD5 do ID + Timestamp)."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "ID natural do cliente. Pode se repetir se houver histórico."
        
      - name: segment
        description: "Segmento do cliente tratado."
        
      - name: state
        description: "UF do cliente."
        

  - name: silver_work_orders
    description: "Ordens de serviço versionadas (SCD2)."
    columns:
      - name: work_order_sk
        description: "Chave única da versão da Ordem de Serviço."
        tests:
          - unique
          - not_null

      - name: work_order_id
        description: "ID natural da Ordem de Serviço."
        

      - name: customer_sk
        description: "FK para a versão do cliente vigente no momento da ordem."
        tests:
          - not_null

      - name: status
        description: "Status da ordem."
        tests:
          - accepted_values:
              values: ['OPEN', 'CLOSED', 'CANCELLED', 'IN_PROGRESS', 'UNKNOWN']

      - name: labor_hours
        description: "Horas de mão de obra (Nulos convertidos para 0)."
        

  - name: silver_parts_sales
    description: "Venda de peças individuais vinculadas a versões específicas de Ordens de Serviço."
    columns:
      - name: sale_sk
        description: "Chave única da versão da venda."
        tests:
          - unique
          - not_null

      - name: sale_id
        description: "ID natural da venda."
        
      - name: work_order_sk
        description: "FK para a versão da Ordem de Serviço vigente no momento da venda."
        
      - name: total_price
        description: "Preço total recalculado (quantity * unit_price)."
        
      - name: sale_date
        description: "Data da venda tratada."
        